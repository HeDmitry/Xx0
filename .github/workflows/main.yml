name: Сборка Android APK (Buildozer)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Buildozer Android APK
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/.android/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.android/android-sdk

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Настройка Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка системных утилит и библиотек компиляции
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libsqlite3-dev \
            libreadline-dev \
            ccache

      - name: Установка Cython, Buildozer и зависимостей Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3"
          python -m pip install "buildozer==1.5.0"
          python -m pip install virtualenv

      - name: Очистка старых артефактов сборки
        run: |
          rm -rf .buildozer ~/.buildozer

      - name: Кэширование загрузок Buildozer (Android SDK/NDK/Gradle)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            ~/.gradle
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Сборка APK с помощью Buildozer
        run: |
          buildozer -v android debug

      - name: Выгрузка готового APK файла как артефакт
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Hotseat-Android-APK
          path: bin/*.apk

      - name: Выгрузка логов сборки при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            .buildozer/**/build.log
            .buildozer/**/*.log
