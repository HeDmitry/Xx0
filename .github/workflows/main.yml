name: Сборка Android APK (Buildozer)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Настройка Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Очистка дискового пространства
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Установка системных зависимостей Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            zip \
            unzip \
            ccache

      - name: Установка Python-пакетов
        run: |
          python -m pip install --upgrade pip setuptools packaging wheel
          pip install "cython<3.0.0" buildozer virtualenv

      - name: Компиляция APK с помощью Buildozer
        env:
          ACCEPT_BUILD_TOOLS_CHECKSUMS: 1
        run: |
          # Автоматическое принятие всех лицензий SDK/NDK через pipe yes
          yes | buildozer -v android debug

      - name: Загрузка готового APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
