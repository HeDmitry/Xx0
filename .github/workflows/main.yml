        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Настройка Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка системных утилит и библиотек компиляции
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache

      - name: Установка Cython, Buildozer и зависимостей Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install Cython==0.29.36
          pip install "buildozer>=1.5.0"
          pip install virtualenv

      - name: Кэширование загрузок Buildozer (Android SDK/NDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Сборка APK с помощью Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: master
      - name: Сборка APK с помощью Buildozer
        run: |
          buildozer -v android debug

      - name: Выгрузка готового APK файла как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Hotseat-Android-APK
          path: ${{ steps.buildozer.outputs.filename }}

          path: bin/*.apk
