name: Build Android APK (Buildozer)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libsqlite3-dev \
            libreadline-dev \
            ccache \
            lld

      - name: Install Buildozer, Cython and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.0"
          python -m pip install --upgrade buildozer
          python -m pip install virtualenv

      - name: Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            ~/.gradle
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build Android APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Android-APK
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build logs (in case of failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-debug-logs
          path: |
            .buildozer/**/build.log
            .buildozer/**/*.log
          if-no-files-found: ignore
